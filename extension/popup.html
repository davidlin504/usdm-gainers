<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>USDⓈ-M 漲幅榜</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <div class="brand">
        <img class="brand__logo" src="./logo.svg" alt="" />
        <span class="brand__dot" id="liveDot"></span>
        <a class="rankings__url" href="https://www.binance.com/zh-TC/markets/trading_data/rankings" target="_blank">
          <h1 class="brand__title">USD Features 漲幅榜</h1>
        </a>
      </div>
      <div class="header-menu">
        <a href="./position.html" title="查看合約倉位">
          <span class="row__icon-btn features-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 7V5a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v2"></path><line x1="12" y1="12" x2="12" y2="12.01"></line></svg>
          </span>
        </a>
        <button id="menuToggleBtn" class="row__icon-btn header-menu__toggle" type="button" title="選單" aria-expanded="false" aria-controls="headerMenuPanel">
          <svg class="hamburger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line class="hamburger-icon__l1" x1="4" y1="7" x2="20" y2="7"></line>
            <line class="hamburger-icon__l2" x1="4" y1="12" x2="20" y2="12"></line>
            <line class="hamburger-icon__l3" x1="4" y1="17" x2="20" y2="17"></line>
          </svg>
        </button>
        <div id="headerMenuPanel" class="header-menu__panel" hidden>
          <label class="toggle" title="切換跑馬燈模式">
            <span class="toggle__label">Lite</span>
            <input type="checkbox" id="tickerToggle" />
            <span class="toggle__track"><span class="toggle__thumb"></span></span>
          </label>
          <label class="toggle" title="顯示/隱藏市值資訊">
            <span class="toggle__label">mcap</span>
            <input type="checkbox" id="mcapToggle" />
            <span class="toggle__track"><span class="toggle__thumb"></span></span>
          </label>
        </div>
      </div>
    </header>

    <div class="subbar">
      <span class="subbar__label">TOP 10 GAINERS · 24H</span>
      <span class="subbar__updated" id="updatedAt">—</span>
    </div>

    <div id="content" class="content">
      <div class="skeleton-list" id="skeleton">
        <!-- skeleton rows injected by JS -->
      </div>
    </div>

    <div id="errorBox" class="error-box" hidden>
      <p id="errorText">無法載入資料</p>
      <button id="retryBtn" class="retry-btn">重試</button>
    </div>

    <footer class="app__footer">
      <span>資料來源：Binance Futures Public API</span>
      <button id="refreshBtn" class="refresh-btn" title="立即重新整理" aria-label="重新整理">
        <span id="countdown">30s</span>
        <svg class="refresh-icon" viewBox="0 0 24 24" width="15" height="15"><path fill="#17e6a1" d="M12 5V2L7 6l5 4V7c3.31 0 6 2.69 6 6a5.99 5.99 0 0 1-9.7 4.7l-1.42 1.42A7.98 7.98 0 0 0 12 21c4.42 0 8-3.58 8-8s-3.58-8-8-8z"/></svg>
      </button>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
