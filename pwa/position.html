<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>USDⓈ-M 合約倉位</title>
<meta name="theme-color" content="#0b0e14" />
<link rel="icon" type="image/svg+xml" href="./logo.svg" />

<link rel="stylesheet" href="./style.css" />
<style>
  /* 這個頁面的樣式沿用 style.css 的顏色變數，但排版（表單/卡片/表格）是這裡專用的，
     不放進 style.css，避免污染漲幅榜主頁面的樣式。 */
  .pos-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px;
  }
  .pos-back {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 18px;
    flex-shrink: 0;
  }
  .pos-back:hover { color: var(--text); }
  .pos-title {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    color: var(--text);
  }

  .pos-main {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 24px;
    transition: max-width 0.15s ease;
  }
  /* 有倉位資料時放寬寬度限制，讓桌面/寬螢幕能一次看到多欄倉位卡片；
     還在設定金鑰、沒有資料的階段維持手機版寬度即可。 */
  body.has-positions .pos-main {
    max-width: 480px;
  }

  .pos-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .pos-card__title {
    font-size: 18px;
    color: var(--text-dim);
    margin: 0 0 10px;
    letter-spacing: 0.02em;
  }

  .pos-card__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .pos-card__head-left {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .pos-card__head-right {
    float: right;
    display: block;
    gap: 4px;
    margin-bottom: 10px;
  }
  /* .pos-card__head-right 用 float 定位後會脫離正常流，#summaryCard 的高度／border
     不會把它算進去；帳戶總覽收合時 #summaryGrid 變成 display:none，沒有東西再撐開
     高度，border 就會直接畫穿過浮動內容。display: flow-root 讓 #summaryCard 自己
     形成新的 block formatting context 把浮動內容包住。這裡一定要加 :not([hidden])：
     id 選擇器的優先權比 [hidden] 屬性選擇器高，若沒有 :not 這條規則會蓋掉瀏覽器
     預設的 [hidden] { display: none }，導致整張卡片收合時反而不會消失。 */
  #summaryCard:not([hidden]) {
    display: flow-root;
  }
  .pos-card__toggle {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .pos-card__toggle:hover { color: var(--text); }
  .pos-card__toggle svg { width: 16px; height: 16px; display: block; }
  /* API 金鑰區域的展開/收合按鈕比較小顆，點擊熟悉度也最高，特別放大字級加大點擊範圍。 */
  #credToggleBtn { font-size: 22px; }
  #summaryToggleBtn { font-size: 22px; }
  .pos-card__updated {
    font-size: 18px;
    color: var(--text-faint);
  }
  .pos-card__refresh-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pos-card__countdown {
    font-size: 18px;
    color: var(--text-faint);
    font-family: var(--mono);
  }
  .pos-card__summary {
    font-size: 18px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .pos-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }
  .pos-field label {
    font-size: 18px;
    color: var(--text-dim);
  }
  .pos-field input {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 18px;
  }
  .pos-field input:focus { outline: 1px solid var(--accent); }

  .pos-note {
    font-size: 18px;
    color: var(--text-faint);
    line-height: 1.5;
    margin: 0 0 10px;
  }

  .pos-actions { display: flex; gap: 8px; }
  .pos-btn {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--panel-alt);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 0;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
  }
  .pos-btn--primary { background: var(--accent); color: #05130f; border-color: var(--accent); }
  .pos-btn--danger { color: var(--down); }
  .pos-btn:disabled { opacity: 0.5; cursor: default; }

  .pos-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  /* 同上：display:grid 蓋掉了 [hidden] 預設的 display:none，收合帳戶總覽時要補這條才會真的消失。 */
  .pos-summary[hidden] { display: none; }
  .pos-summary__item { display: flex; flex-direction: column; gap: 2px; }
  .pos-summary__label { font-size: 18px; color: var(--text-dim); }
  .pos-summary__value { font-family: var(--mono); font-size: 18px; color: var(--text); }

  .pos-row {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .pos-row__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .pos-row__symbol { font-weight: 700; font-size: 18px; }
  .pos-row__head-links { display: flex; align-items: center; gap: 6px; }
  .pos-row__side {
    font-size: 18px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .pos-row__side.is-long { color: var(--up); background: var(--up-dim); }
  .pos-row__side.is-short { color: var(--down); background: var(--down-dim); }

  .pos-row__grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
    font-family: var(--mono);
    font-size: 18px;
  }
  .pos-row__grid-item { display: flex; flex-direction: column; gap: 2px; }
  .pos-row__grid-label { color: var(--text-dim); font-family: var(--sans); }
  .is-up { color: var(--up); }
  .is-down { color: var(--down); }

  .pos-list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .pos-list-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .pos-sort-select {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    color: var(--text);
    font-size: 18px;
  }

  /* 有倉位資料時改成多欄卡片排列，充分利用放寬後的頁面寬度；篩選後沒有任何結果時
     顯示的是一段純文字提示，不套用 grid（避免那段文字被拉成奇怪的格子寬度）。 */
  #positionsList.is-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }
  #positionsList.is-grid .pos-row { margin-bottom: 0; }

  /* 列表顯示：只留 symbol / icon-btn / side / roi 一行，跟卡片顯示切換時共用同一個
     進場動畫（見 .pos-row-enter），不用另外寫轉場邏輯。 */
  .pos-list-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 8px;
  }
  .pos-list-row__symbol {
    font-weight: 700;
    font-size: 18px;
    flex: 1;
    min-width: 0;
  }
  .pos-list-row__icons { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .pos-list-row__roi {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
    min-width: 64px;
    text-align: right;
  }

  @keyframes pos-row-enter {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .pos-row, .pos-list-row { animation: pos-row-enter 0.18s ease both; }

  .pos-empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 18px;
    padding: 30px 0;
  }

  .error-box.pos-error { margin: 0 16px 12px; }
</style>
</head>
<body>

  <div class="pos-main">
    <div class="pos-header">
      <a id="backLink" class="pos-back" href="./index.html">‹ 漲幅榜</a>
      <span class="brand__dot" id="liveDot"></span>
      <h1 class="pos-title">USDⓈ-M 合約倉位</h1>
    </div>
    <div class="pos-card">
      <div class="pos-card__head">
        <p class="pos-card__title" style="margin:0;">API 金鑰（唯讀權限即可，不要開啟提現權限）</p>
        <button id="credToggleBtn" class="pos-card__toggle" type="button" title="展開/收合">▾</button>
      </div>
      <div id="credentialsCollapsedHint" class="pos-card__summary" hidden>已儲存金鑰，點右上角展開可編輯</div>
      <div id="credentialsBody">
        <div class="pos-field">
          <label for="apiKeyInput">API Key</label>
          <input id="apiKeyInput" type="text" autocomplete="off" spellcheck="false" placeholder="貼上 API Key" />
        </div>
        <div class="pos-field">
          <label for="apiSecretInput">Secret Key</label>
          <input id="apiSecretInput" type="password" autocomplete="off" spellcheck="false" placeholder="貼上 Secret Key" />
        </div>
        <p class="pos-note">金鑰只會存在本機瀏覽器的 localStorage，不會送到任何第三方伺服器（PWA 環境下會經由你自己部署的 Cloudflare Worker 轉發簽名後的請求，Worker 本身看不到 Secret Key）。清除瀏覽器資料會一併清掉金鑰。</p>
        <div class="pos-actions">
          <button id="saveBtn" class="pos-btn pos-btn--primary">儲存並查詢</button>
          <button id="clearBtn" class="pos-btn pos-btn--danger">清除金鑰</button>
        </div>
      </div>
    </div>

    <div id="summaryCard" class="pos-card" hidden>
      <div class="pos-card__head">
        <div id="summaryHeadLeft" class="pos-card__head-left">
          <span class="brand__dot" id="liveDot"></span>
          <p class="pos-card__title" style="margin:0;">帳戶總覽</p>
          <button id="visibilityToggleBtn" class="pos-card__toggle" type="button" title="隱藏帳戶資訊"></button>
        </div>
        <button id="summaryToggleBtn" class="pos-card__toggle" type="button" title="展開/收合">▾</button>
      </div>
      <div class="pos-card__head-right">
        <span id="updatedAt" class="pos-card__updated">尚未查詢</span>
        <div class="pos-card__refresh-row">
          <span id="countdown" class="pos-card__countdown" hidden></span>
          <button id="refreshBtn" class="pos-card__toggle" title="重新整理">⟲ 重新整理</button>
        </div>
      </div>
      <div id="summaryGrid" class="pos-summary">
        <div class="pos-summary__item">
          <span class="pos-summary__label">錢包餘額</span>
          <span id="sumWalletBalance" class="pos-summary__value">—</span>
        </div>
        <div class="pos-summary__item">
          <span class="pos-summary__label">未實現盈虧</span>
          <span id="sumUnrealizedProfit" class="pos-summary__value">—</span>
        </div>
        <div class="pos-summary__item">
          <span class="pos-summary__label">保證金餘額</span>
          <span id="sumMarginBalance" class="pos-summary__value">—</span>
        </div>
        <div class="pos-summary__item">
          <span class="pos-summary__label">可用餘額</span>
          <span id="sumAvailableBalance" class="pos-summary__value">—</span>
        </div>
      </div>
    </div>

    <div id="positionsHeader" class="pos-list-header" hidden>
      <p class="pos-card__title" style="margin:0;">持倉</p>
      <div class="pos-list-controls">
        <label class="toggle" title="切換卡片/列表顯示">
          <span class="toggle__label">列表</span>
          <input type="checkbox" id="viewToggle" checked />
          <span class="toggle__track"><span class="toggle__thumb"></span></span>
        </label>
        <select id="sideFilterSelect" class="pos-sort-select">
          <option value="all">多空皆顯示</option>
          <option value="long">只顯示多</option>
          <option value="short">只顯示空</option>
        </select>
        <select id="sortSelect" class="pos-sort-select">
          <option value="none">預設排序</option>
          <option value="roi-desc" selected>ROI 遞減</option>
          <option value="roi-asc">ROI 遞增</option>
        </select>
      </div>
    </div>
    <div id="positionsList"></div>

    <div id="errorBox" class="error-box pos-error" hidden>
      <p id="errorText">無法載入資料</p>
      <button id="retryBtn" class="retry-btn">重試</button>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./position.js"></script>
</body>
</html>
