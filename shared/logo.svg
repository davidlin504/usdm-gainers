<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#17e6a1"/>
      <stop offset="100%" stop-color="#5bffc9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="184" height="184" rx="36" fill="url(#bgGrad)" stroke="#232936" stroke-width="2"/>

  <!-- chart grid -->
  <g stroke="#232936" stroke-width="1.5" opacity="0.7">
    <line x1="28" y1="60" x2="172" y2="60"/>
    <line x1="28" y1="100" x2="172" y2="100"/>
    <line x1="28" y1="140" x2="172" y2="140"/>
  </g>

  <!-- candlesticks -->
  <g stroke-linecap="round">
    <!-- down candle 1 -->
    <line x1="49" y1="118" x2="49" y2="150" stroke="#ff5470" stroke-width="4"/>
    <rect x="40" y="130" width="18" height="26" rx="2" fill="#ff5470"/>
    <!-- down candle 2 -->
    <line x1="77" y1="104" x2="77" y2="140" stroke="#ff5470" stroke-width="4"/>
    <rect x="68" y="116" width="18" height="40" rx="2" fill="#ff5470"/>
    <!-- up candle 1 -->
    <line x1="105" y1="86" x2="105" y2="122" stroke="#17e6a1" stroke-width="4"/>
    <rect x="96" y="98" width="18" height="58" rx="2" fill="#17e6a1"/>
    <!-- up candle 2 -->
    <line x1="133" y1="66" x2="133" y2="102" stroke="#17e6a1" stroke-width="4"/>
    <rect x="124" y="78" width="18" height="78" rx="2" fill="#17e6a1"/>
    <!-- up candle 3 -->
    <line x1="161" y1="44" x2="161" y2="80" stroke="#17e6a1" stroke-width="4"/>
    <rect x="152" y="56" width="18" height="100" rx="2" fill="#17e6a1"/>
  </g>

  <!-- trend arrow -->
  <g filter="url(#glow)">
    <polyline points="40,150 68,120 96,102 124,82 152,40 164,28"
              fill="none" stroke="url(#arrowGrad)" stroke-width="8"
              stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="177,15 172,35 158,20" fill="#5bffc9"/>
  </g>
</svg>
